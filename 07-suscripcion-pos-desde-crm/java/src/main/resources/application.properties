spring.application.name=suscripcion-pos-desde-crm
# Lee las variables desde el archivo .env (VIRTUALPOS_API_URL, VIRTUALPOS_API_KEY, VIRTUALPOS_SECRET_KEY, VIRTUALPOS_PLAN_ID, POS_TERMINALES, PUBLIC_URL, PORT)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
virtualpos.api-url=${VIRTUALPOS_API_URL:}
virtualpos.api-key=${VIRTUALPOS_API_KEY:}
virtualpos.secret-key=${VIRTUALPOS_SECRET_KEY:}
virtualpos.plan-id=${VIRTUALPOS_PLAN_ID:}
app.pos-terminales=${POS_TERMINALES:}
app.public-url=${PUBLIC_URL:http://localhost:8080}
