spring.application.name=garantia-pos
# Lee las variables desde el archivo .env (VIRTUALPOS_POS_API_URL, VIRTUALPOS_POS_API_KEY, VIRTUALPOS_WEBHOOK_SECRET, VIRTUALPOS_POS_SERIAL, PUBLIC_URL, PORT)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
virtualpos.pos.api-url=${VIRTUALPOS_POS_API_URL:https://ms-payment-c2c.virtualpos-dev.com/ms-payment-c2c}
virtualpos.pos.api-key=${VIRTUALPOS_POS_API_KEY:}
virtualpos.pos.webhook-secret=${VIRTUALPOS_WEBHOOK_SECRET:}
virtualpos.pos.serial=${VIRTUALPOS_POS_SERIAL:}
app.public-url=${PUBLIC_URL:http://localhost:8080}
